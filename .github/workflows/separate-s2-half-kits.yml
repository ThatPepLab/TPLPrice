name: Separate S2 half kits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separate-s2-half-kits.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Separate S2 half kits in USA offers
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_region = 'function region(o){return /US Warehouse|S2 Wellness/i.test(o.vendor)?"USA":"CHINA"}'
          new_region = old_region + "\nfunction offerSection(o){return o.vendor==='S2 Wellness'&&o.vials===5?'USA_HALF':region(o)}"
          assert s.count(old_region) == 1, 'region anchor missing or duplicated'
          assert 'function offerSection(o)' not in s, 'offerSection already installed'
          s = s.replace(old_region, new_region, 1)

          old_loop = "for(const place of ['CHINA','USA']){let group=arr.filter(o=>region(o)===place).sort(sorter);"
          new_loop = "for(const place of ['CHINA','USA','USA_HALF']){let group=arr.filter(o=>offerSection(o)===place).sort(sorter);"
          assert s.count(old_loop) == 1, 'offer section loop anchor missing or duplicated'
          s = s.replace(old_loop, new_loop, 1)

          old_lowest = "lowest=!review&&!rule(o.vendor).unknown&&estimated(o)===low"
          new_lowest = "lowest=place!=='USA_HALF'&&!review&&!rule(o.vendor).unknown&&estimated(o)===low"
          assert s.count(old_lowest) == 1, 'lowest badge anchor missing or duplicated'
          s = s.replace(old_lowest, new_lowest, 1)

          old_heading = "html+=`<div style=\"font-size:19px;font-weight:900;letter-spacing:.08em;color:#ff9a61;border-bottom:3px solid #ff7a2f;padding:13px 2px 7px;margin-top:${html?'16':'0'}px\">${place}</div>`;html+=group.map"
          new_heading = "let sectionLabel=place==='USA_HALF'?'USA — 1/2 KITS · 5 VIALS ONLY':place;html+=`<div style=\"font-size:19px;font-weight:900;letter-spacing:.08em;color:#ff9a61;border-bottom:3px solid #ff7a2f;padding:13px 2px 7px;margin-top:${html?'16':'0'}px\">${sectionLabel}</div>${place==='USA_HALF'?'<div style=\"background:#fff3cd;color:#5b3a00;border:2px solid #ffb703;border-radius:10px;padding:10px 12px;font-weight:900;margin:4px 0 8px\">⚠ HALF KITS: 5 vials. Prices below are NOT directly comparable to standard 10-vial kit prices.</div>':''}`;html+=group.map"
          assert s.count(old_heading) == 1, 'section heading anchor missing or duplicated'
          s = s.replace(old_heading, new_heading, 1)

          # Guardrails: S2 half kits stay USA and never mix into normal USA comparison.
          assert "o.vendor==='S2 Wellness'&&o.vials===5?'USA_HALF'" in s
          assert "['CHINA','USA','USA_HALF']" in s
          assert "Prices below are NOT directly comparable to standard 10-vial kit prices" in s
          assert "place!=='USA_HALF'" in s

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Separate S2 half kits from full USA kits"
          git push
