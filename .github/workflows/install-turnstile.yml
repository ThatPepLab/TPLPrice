name: Install Turnstile gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-turnstile.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TPLPrice access flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("tplPriceAccessV4", "tplPriceAccessV5")
          tag = '<script src="access-turnstile.js?v=20260914-2"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable Turnstile on TPLPrice login"
          git push
