name: Check COA9437 document link once
on:
  push:
    paths:
      - '.github/workflows/check-coa-link-once.yml'
permissions:
  contents: read
jobs:
  check-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check candidate direct document URL status only
        run: |
          for url in 'https://bioviridians.com/coas/COA9437.pdf' 'https://www.bioviridians.com/coas/COA9437.pdf' 'https://bioviridians.com/coa-search.html'; do
            echo "URL $url"
            curl -L -sS --max-time 15 -A 'Mozilla/5.0' -o /tmp/coa-response -w 'HTTP %{http_code} MIME %{content_type} BYTES %{size_download}\n' "$url" || true
            file -b /tmp/coa-response || true
          done