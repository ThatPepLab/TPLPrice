name: Add owner COA9437 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-owner-coa9437-once.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach owner COA to exact Luvino GLP-3RT 20mg listing
        run: |
          python3 - <<'PY'
          import json, pathlib
          data_file=pathlib.Path('coa-data.json')
          data=json.loads(data_file.read_text())
          pdf='https://bioviridians.com/coas/COA9437.pdf'
          record={'vendor':'Luvino','product':'GLP-3RT','strength':'20mg','netContent':'21.44 mg','purity':'99.75%','lab':'Bioviridian','analysisDate':'2026-09-17','reportUrl':pdf,'previewUrl':pdf,'status':'Passed','ownerPreferred':True,'verificationCode':'COA9437','lot':'LUSA8530-7 / BLUE CAP','attribution':'Owner supplied: Luvino; COA sample vendor field: TPL'}
          existing=[r for r in data.get('completed',[]) if r.get('reportUrl','').lower()==pdf.lower()]
          assert len(existing)<=1, 'Duplicate COA9437 record detected'
          if existing:
            existing[0].update(record)
          else:
            data['completed'].append(record)
          data['counts']['completed']=len(data['completed'])
          assert sum(r.get('ownerPreferred') is True and r.get('reportUrl')==pdf for r in data['completed'])==1
          data_file.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          widget=pathlib.Path('coa-widget.js')
          s=widget.read_text()
          replacements=[
            ('(!vendorId || vendorKey(record.vendor) === vendorId)', '(!vendorId || vendorKey(record.vendor) === vendorId || (record.ownerPreferred === true && vendorId.startsWith("lunivo") && vendorKey(record.vendor) === "lunivo"))'),
            ('const latestPassed = sorted.find((record) => statusInfo(record).label === "Passed");', 'const latestPassed = sorted.find((record) => record.ownerPreferred === true && statusInfo(record).label === "Passed") || sorted.find((record) => statusInfo(record).label === "Passed");'),
            ("+ '>Latest Passed COA · ' + esc(prettyDate(latestPassed.analysisDate))", "+ '>' + (latestPassed.ownerPreferred ? 'Our Test COA · ' : 'Latest Passed COA · ') + esc(prettyDate(latestPassed.analysisDate))"),
            ("esc(record.vendor) + \"</strong><span>Completed \"", "esc(record.ownerPreferred ? 'Our Test · ' + record.vendor : record.vendor) + \"</strong><span>Completed \""),
            ("Testing records are linked from the <a href=", "Testing records include owner-submitted reports and records from the <a href="),
          ]
          for old,new in replacements:
            if old=='(!vendorId || vendorKey(record.vendor) === vendorId)':
              assert s.count(old)==2, 'Expected two vendor matching expressions'
              s=s.replace(old,new)
            else:
              assert s.count(old)==1, 'COA UI anchor did not match: '+old[:50]
              s=s.replace(old,new,1)
          assert s.count('ownerPreferred')>=5
          widget.write_text(s)
          html_file=pathlib.Path('index.html')
          html=html_file.read_text()
          import re
          script_tags=re.findall(r'<script[^>]+src=["\'][^"\']*coa-widget\.js[^"\']*["\'][^>]*>',html)
          assert len(script_tags)==1, 'Expected exactly one COA script'
          previous=script_tags[0]
          revised=re.sub(r'coa-widget\.js(?:\?v=[^"\']*)?', 'coa-widget.js?v=20260920-9437',previous)
          assert revised!=previous, 'COA asset version was unchanged'
          html=html.replace(previous,revised,1)
          html_file.write_text(html)
          print('PASS: Luvino GLP-3RT 20mg COA9437 opens direct PDF and takes priority for Luvino US/China; source history retained')
          PY
          node --check coa-widget.js
          git diff --check
      - name: Commit exact COA linkage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coa-data.json coa-widget.js index.html
          git diff --cached --check
          git commit -m 'Link owner COA9437 as preferred Luvino GLP-3RT 20mg certificate'
          git push